<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>MiniApp Planisfero Interattivo</title>
  <style>
    body {
      background-color: #eef;
      font-family: Georgia, serif;
      text-align: center;
    }

    h1 { margin-bottom: 5px; }

    .map-container {
      position: relative;
      display: inline-block;
      margin-top: 20px;
    }

    .map-container img {
      max-width: 100%;
      border: 2px solid #444;
      border-radius: 10px;
      display: block;
    }

    .continent {
      position: absolute;
      font-size: 1.2em;
      font-weight: bold;
      color: black;
      background-color: rgba(255, 255, 255, 0.7);
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
    }

    /* Posizionamento indicativo dei label continenti */
    .america { top: 45%; left: 12%; }
    .europa  { top: 28%; left: 46%; }
    .africa  { top: 55%; left: 46%; }
    .asia    { top: 32%; left: 65%; }
    .oceania { top: 72%; left: 80%; }

    /* Nave animata: Oceania (ancora più a sud) → Argentina → ritorno */
    .ship {
      position: absolute;
      width: 62px;
      z-index: 10;
      top: 85%;    /* Oceania: più a sud */
      left: 95%;   /* bordo destro del planisfero */
      animation: rottaOceaniaArgentina 30s linear infinite alternate;
      /* alternate = avanti e indietro */
      filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3));
    }

    @keyframes rottaOceaniaArgentina {
      0%   { left: 80%; top: 84%; }  /* Partenza Oceania sud */
      30%  { left: 75%; top: 85%; }  /* Pacifico centrale */
      60%  { left: 30%; top: 83%; }  /* Verso Sud America */
      100% { left: 20%; top: 86%; }  /* Arrivo Argentina */
    }

    /* Popup */
    .popup {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      border: 2px solid #333;
      border-radius: 8px;
      padding: 20px;
      max-width: 300px;
      z-index: 100;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .popup h2 { margin-top: 0; }

    .popup button {
      margin-top: 10px;
      padding: 6px 12px;
      background: #444;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>MiniApp: Esplora i Continenti</h1>
  <p style="font-size: 1.2em; font-style: italic; margin-top: -10px;">prof.ssa Antonella Magurno</p>
  <p style="font-size: 0.9em; color: #555; margin-top: -5px;">
    Attività generata con l'aiuto di strumenti di IA
  </p>

  <div class="map-container">
    <img src="planisfero.png" alt="Planisfero">
    <img src="nave.png" alt="Nave in viaggio" class="ship">

    <div class="continent america" onclick="showPopup('America')">America</div>
    <div class="continent europa" onclick="showPopup('Europa')">Europa</div>
    <div class="continent africa" onclick="showPopup('Africa')">Africa</div>
    <div class="continent asia" onclick="showPopup('Asia')">Asia</div>
    <div class="continent oceania" onclick="showPopup('Oceania')">Oceania</div>
  </div>

  <!-- Popup -->
  <div id="popup" class="popup">
    <h2 id="popup-title"></h2>
    <p id="popup-text"></p>
    <button onclick="closePopup()">Chiudi</button>
  </div>

  <script>
    function showPopup(continent) {
      const popup = document.getElementById("popup");
      const title = document.getElementById("popup-title");
      const text = document.getElementById("popup-text");

      title.textContent = continent;

      switch (continent) {
        case "America":
          text.textContent = "Include Nord, Centro e Sud America, con grande varietà culturale e geografica.";
          break;
        case "Europa":
          text.textContent = "Culla della civiltà occidentale, ricca di storia, lingue e culture.";
          break;
        case "Africa":
          text.textContent = "Secondo continente più grande, noto per biodiversità e antiche civiltà.";
          break;
        case "Asia":
          text.textContent = "Il continente più vasto, con economie emergenti e antiche tradizioni.";
          break;
        case "Oceania":
          text.textContent = "Comprende Australia, Nuova Zelanda e le isole del Pacifico.";
          break;
      }

      popup.style.display = "block";
    }

    function closePopup() {
      document.getElementById("popup").style.display = "none";
    }
  </script>
</body>
</html>
