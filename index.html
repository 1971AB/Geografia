<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>MiniApp Planisfero Interattivo</title>
  <style>
    body {
      background-color: #eef;
      font-family: Georgia, serif;
      text-align: center;
    }

    h1 { margin-bottom: 5px; }

    .map-container {
      position: relative;
      display: inline-block;
      margin-top: 20px;
    }

    .map-container img {
      max-width: 100%;
      border: 2px solid #444;
      border-radius: 10px;
      display: block;
    }

    .continent {
      position: absolute;
      font-size: 1.2em;
      font-weight: bold;
      color: black;
      background-color: rgba(255, 255, 255, 0.7);
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
    }

    /* Posizionamento indicativo dei label continenti */
    .america { top: 45%; left: 12%; }
    .europa  { top: 28%; left: 46%; }
    .africa  { top: 55%; left: 46%; }
    .asia    { top: 32%; left: 65%; }
    .oceania { top: 72%; left: 80%; }

    /* Nave animata: Oceania → Argentina → ritorno */
    .ship {
      position: absolute;
      width: 62px;
      z-index: 10;
      top: 85%;
      left: 95%;
      animation: rottaOceaniaArgentina 30s linear infinite alternate;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3));
    }

    @keyframes rottaOceaniaArgentina {
      0%   { left: 80%; top: 84%; }
      30%  { left: 75%; top: 85%; }
      60%  { left: 30%; top: 83%; }
      100% { left: 20%; top: 86%; }
    }

    /* Popup */
    .popup {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      border: 2px solid #333;
      border-radius: 8px;
      padding: 20px;
      max-width: 400px;
      z-index: 100;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      text-align: left;
    }

    .popup h2 { margin-top: 0; }

    .popup .close-btn {
      margin-top: 12px;
      padding: 6px 12px;
      background: #444;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .quiz-btn {
      margin: 3px 6px 8px 0;
      padding: 6px 10px;
      background: #2a4d8f;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .quiz-btn:hover { background: #1d3560; }
    .divider { margin: 12px 0; border-top: 1px solid #ddd; }
  </style>
</head>
<body>
  <h1>MiniApp: Esplora i Continenti</h1>
  <p style="font-size: 1.2em; font-style: italic; margin-top: -10px;">prof.ssa Antonella Magurno</p>
  <p style="font-size: 0.9em; color: #555; margin-top: -5px;">
    Attività generata con l'aiuto di strumenti di IA
  </p>

  <div class="map-container">
    <img src="planisfero.png" alt="Planisfero">
    <img src="nave.png" alt="Nave in viaggio" class="ship">

    <div class="continent america" onclick="showPopup('America')">America</div>
    <div class="continent europa" onclick="showPopup('Europa')">Europa</div>
    <div class="continent africa" onclick="showPopup('Africa')">Africa</div>
    <div class="continent asia" onclick="showPopup('Asia')">Asia</div>
    <div class="continent oceania" onclick="showPopup('Oceania')">Oceania</div>
  </div>

  <!-- Popup -->
  <div id="popup" class="popup" role="dialog" aria-modal="true" aria-labelledby="popup-title">
    <h2 id="popup-title"></h2>
    <div id="popup-text"></div>
    <button class="close-btn" onclick="closePopup()">Chiudi</button>
  </div>

  <script>
    // Dati del quiz incorporati (puoi ampliarli)
    const QUIZ = {
      America: [
        { domanda: "Qual è la capitale del Canada?", opzioni: ["Toronto", "Ottawa", "Montreal", "Vancouver"], corretta: "Ottawa" },
        { domanda: "Quale catena montuosa attraversa il Sud America?", opzioni: ["Alpi", "Ande", "Rocciose", "Appalachi"], corretta: "Ande" }
      ],
      Europa: [
        { domanda: "Qual è il fiume più lungo d'Europa?", opzioni: ["Danubio", "Volga", "Reno", "Senna"], corretta: "Volga" },
        { domanda: "Quale catena montuosa separa la Francia dalla Spagna?", opzioni: ["Alpi", "Appennini", "Pirenei", "Carpazi"], corretta: "Pirenei" }
      ],
      Africa: [
        { domanda: "Qual è il deserto più grande del mondo?", opzioni: ["Kalahari", "Sahara", "Namib", "Gobi"], corretta: "Sahara" },
        { domanda: "Quale montagna è la più alta dell’Africa?", opzioni: ["Kilimangiaro", "Monte Kenya", "Rwenzori", "Drakensberg"], corretta: "Kilimangiaro" }
      ],
      Asia: [
        { domanda: "Qual è la montagna più alta del mondo?", opzioni: ["K2", "Everest", "Kangchenjunga", "Makalu"], corretta: "Everest" },
        { domanda: "Quale deserto si trova in Cina e Mongolia?", opzioni: ["Sahara", "Gobi", "Kalahari", "Namib"], corretta: "Gobi" }
      ],
      Oceania: [
        { domanda: "Qual è la capitale dell’Australia?", opzioni: ["Sydney", "Melbourne", "Canberra", "Perth"], corretta: "Canberra" },
        { domanda: "Quale paese è composto da due isole principali: Nord e Sud?", opzioni: ["Fiji", "Nuova Caledonia", "Nuova Zelanda", "Samoa"], corretta: "Nuova Zelanda" }
      ]
    };

    function closePopup() {
      const popup = document.getElementById("popup");
      popup.style.display = "none";
      // Pulizia contenuto per evitare accumuli
      document.getElementById("popup-title").textContent = "";
      document.getElementById("popup-text").innerHTML = "";
    }

    function showPopup(continent) {
      const popup = document.getElementById("popup");
      const title = document.getElementById("popup-title");
      const text = document.getElementById("popup-text");

      // Reset contenuto
      title.textContent = "";
      text.innerHTML = "";

      title.textContent = continent;

      // Descrizione breve
      const descrizioni = {
        America: "Include Nord, Centro e Sud America, con grande varietà culturale e geografica.",
        Europa:  "Culla della civiltà occidentale, ricca di storia, lingue e culture.",
        Africa:  "Secondo continente più grande, noto per biodiversità e antiche civiltà.",
        Asia:    "Il continente più vasto, con economie emergenti e antiche tradizioni.",
        Oceania: "Comprende Australia, Nuova Zelanda e le isole del Pacifico."
      };
      text.innerHTML = "<p>" + (descrizioni[continent] || "") + "</p>";

      // Costruzione quiz (senza fetch)
      const domande = QUIZ[continent];
      if (domande && domande.length) {
        let quizHtml = '<div class="divider"></div><h3>Quiz</h3>';
        domande.forEach((q, i) => {
          quizHtml += `<p>${i + 1}. ${q.domanda}</p>`;
          q.opzioni.forEach(opzione => {
            quizHtml += `<button class="quiz-btn" onclick="verificaRisposta('${opzione.replace(/'/g, "\\'")}', '${q.corretta.replace(/'/g, "\\'")}')">${opzione}</button>`;
          });
        });
        text.innerHTML += quizHtml;
      } else {
        text.innerHTML += '<p><em>Nessun quiz disponibile per questo continente.</em></p>';
      }

      popup.style.display = "block";
    }

    function verificaRisposta(risposta, corretta) {
      if (risposta === corretta) {
        alert("✅ Corretto!");
      } else {
        alert("❌ Sbagliato! La risposta giusta era: " + corretta);
      }
    }
  </script>
</body>
</html>
